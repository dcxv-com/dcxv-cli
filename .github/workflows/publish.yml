name: Publish to npm

# Fires when a GitHub Release is published (matches the existing draft-then-publish
# flow: bump package.json, commit, `gh release create vX.Y.Z --draft`, upload assets,
# then publish the release). No token is stored here — npm's Trusted Publishing (OIDC)
# exchanges this workflow's GitHub identity for a short-lived publish credential at
# publish time, so there is nothing to rotate or leak. Configure the trust relationship
# once at https://www.npmjs.com/package/dcxv-cli/access -> Trusted Publisher: GitHub
# Actions, repo dcxv-com/dcxv-cli, workflow publish.yml.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun test

      # The release tag is the source of truth for what's being published — catches the
      # "forgot to bump package.json before tagging" mistake before it reaches npm
      # (release-sync.test.js already catches version.js/HELP drift; this catches the tag).
      - name: Verify package.json version matches the release tag
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          if [ "$pkg_version" != "$tag" ]; then
            echo "package.json version ($pkg_version) does not match release tag ($tag)." >&2
            exit 1
          fi

      # `package.json`'s own `engines` only requires Node >= 20 for the published
      # package, but the publish JOB needs a newer runtime: the latest npm CLI (needed
      # below for OIDC trusted publishing) itself now requires Node ^22.22 / ^24.15 / >=26
      # to even install, which Node 20 cannot satisfy.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # npm's OIDC trusted-publishing support requires a recent CLI; the one bundled
      # with actions/setup-node's image can lag behind.
      - run: npm install -g npm@latest

      - run: npm publish --provenance
